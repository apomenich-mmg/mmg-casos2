<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMG · Casos de Éxito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Funnel+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --lima:#DCFE6F;--pink:#EC92FF;--lav:#8FA4EF;
  --metrix:#307FE2;--forma:#FE5000;--moov:#E0004D;--vou:#DCFE6F;
  --bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;
  --border:#2A2A2A;--border2:#383838;
  --text:#F5F5F0;--text2:#888880;--text3:#4A4A46;
}
html{scroll-behavior:smooth}
body{font-family:'Funnel Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{text-align:center;width:340px}
.login-mark{font-size:11px;letter-spacing:0.22em;color:var(--text2);text-transform:uppercase;margin-bottom:48px;display:block}
.login-headline{font-family:'Anton',sans-serif;font-size:56px;letter-spacing:0.04em;line-height:0.95;color:var(--text);margin-bottom:8px}
.login-sub{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text2);margin-bottom:40px}
.login-field input{width:100%;padding:14px 18px;font-size:14px;font-family:'Funnel Sans',sans-serif;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);outline:none;text-align:center;letter-spacing:0.08em;transition:border-color 0.15s;margin-bottom:12px}
.login-field input:focus{border-color:var(--lima)}
.login-btn{width:100%;padding:14px;background:var(--lima);color:#000;font-family:'Funnel Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer;transition:opacity 0.15s}
.login-btn:hover{opacity:0.85}
.login-err{font-size:12px;color:var(--moov);margin-top:10px;min-height:16px}
.login-tagline{margin-top:52px;font-family:'Anton',sans-serif;font-size:11px;letter-spacing:0.26em;color:var(--text3);text-transform:uppercase}
#board{display:none}
.topbar{background:rgba(10,10,10,0.92);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(16px)}
.topbar-inner{max-width:1160px;margin:0 auto;padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:0.12em;color:var(--text)}
.brand-sep{width:1px;height:14px;background:var(--border2)}
.brand-label{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text2)}
.count-pill{background:var(--lima);color:#000;font-size:11px;font-weight:600;padding:4px 14px;border-radius:99px;letter-spacing:0.04em}
.wrap{max-width:1160px;margin:0 auto;padding:3.5rem 2rem 6rem}
.hero{margin-bottom:3rem}
.hero-eyebrow{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.hero-title{font-family:'Anton',sans-serif;font-size:clamp(52px,8vw,96px);letter-spacing:0.03em;line-height:0.92;color:var(--text)}
.hero-title em{color:var(--lima);font-style:normal}
.hero-title .out{-webkit-text-stroke:1.5px var(--text3);color:transparent}
.search-wrap{margin-bottom:2.5rem;position:relative;max-width:520px}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:15px;height:15px;pointer-events:none;color:var(--text2)}
.search-wrap input{width:100%;padding:13px 18px 13px 46px;font-size:14px;font-family:'Funnel Sans',sans-serif;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;transition:border-color 0.15s}
.search-wrap input::placeholder{color:var(--text2)}
.search-wrap input:focus{border-color:var(--border2)}
.filters{margin-bottom:2.5rem;display:flex;flex-direction:column;gap:8px}
.filter-row{display:flex;align-items:flex-start;gap:12px}
.filter-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);padding-top:8px;min-width:68px;flex-shrink:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:500;padding:6px 14px;border-radius:99px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.12s;line-height:1.2;font-family:'Funnel Sans',sans-serif;letter-spacing:0.02em}
.chip:hover{border-color:var(--text2);color:var(--text)}
.divider{height:1px;background:var(--border);margin-bottom:2rem}
.cases{display:flex;flex-direction:column}
.empty{padding:4rem;text-align:center;font-size:14px;color:var(--text2)}
.loading{text-align:center;padding:4rem;font-size:13px;color:var(--text2)}
.error-msg{background:#1A0808;border:1px solid #5A1414;border-radius:10px;padding:14px 18px;font-size:12px;color:#F99;margin-bottom:1.5rem}
.case-card{overflow:hidden;transition:background 0.1s;border-bottom:1px solid var(--border)}
.case-card:first-child{border-top:1px solid var(--border)}
.case-card:hover{background:var(--bg2)}
.case-main{display:grid;grid-template-columns:3px 1fr auto;align-items:center;gap:20px;padding:18px 4px;cursor:pointer}
.accent-bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
.a-Metrix{background:var(--metrix)}.a-Forma{background:var(--forma)}.a-Moov{background:var(--moov)}.a-Vou{background:var(--vou)}.a-none{background:var(--border2)}
.case-body{min-width:0}
.case-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.case-client{font-family:'Anton',sans-serif;font-size:17px;letter-spacing:0.07em;text-transform:uppercase;color:var(--text);line-height:1}
.case-name{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px;line-height:1.4}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:500;padding:3px 9px;border-radius:99px;white-space:nowrap;letter-spacing:0.04em}
.t-area-Metrix{background:#0C2A4E;color:#5BA8FF}
.t-area-Forma{background:#3D1400;color:#FF8A55}
.t-area-Moov{background:#3D0018;color:#FF6699}
.t-area-Vou{background:#2A3300;color:#B8D62A}
.t-neutral{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.t-tipo{background:#1A1A2E;color:var(--lav)}
.case-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-res{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:6px 12px;border-radius:7px;border:1px solid var(--border2);color:var(--text2);background:transparent;cursor:pointer;transition:all 0.12s;white-space:nowrap;font-family:'Funnel Sans',sans-serif;letter-spacing:0.02em}
.btn-res:hover{background:var(--lima);border-color:var(--lima);color:#000}
.chev-wrap{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text3)}
.chev-wrap svg{transition:transform 0.18s}
.chev-wrap.open svg{transform:rotate(180deg)}
.case-detail{display:none;padding:0 4px 22px 24px}
.case-detail.open{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 32px;margin-bottom:20px}
.dl{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.dv{font-size:13px;color:var(--text)}
.detail-links{display:flex;gap:8px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:8px 16px;border-radius:8px;border:1px solid var(--border2);color:var(--text);background:transparent;cursor:pointer;transition:all 0.15s;font-family:'Funnel Sans',sans-serif}
.lnk:hover{background:var(--lima);border-color:var(--lima);color:#000}
.no-res-txt{font-size:12px;color:var(--text3);padding:8px 0}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <span class="login-mark">Moov Media Group</span>
    <div class="login-headline">CASOS<br>DE ÉXITO</div>
    <div class="login-sub">Base interna · MMG</div>
    <div class="login-field">
      <input type="password" id="pwd-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')checkPwd()">
    </div>
    <button class="login-btn" onclick="checkPwd()">Ingresar</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-tagline">NEXT IS NOW</div>
  </div>
</div>

<div id="board">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo">MMG</div>
        <div class="brand-sep"></div>
        <div class="brand-label">Casos de Éxito</div>
      </div>
      <span class="count-pill" id="count-lbl">Cargando…</span>
    </div>
  </div>
  <div class="wrap">
    <div class="hero">
      <div class="hero-eyebrow">Base de conocimiento · MMG</div>
      <h1 class="hero-title"><em>CASOS</em><br><span class="out">DE ÉXITO</span></h1>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
      <input type="text" id="q" placeholder="Buscar por cliente, caso o industria…" oninput="render()">
    </div>
    <div class="filters" id="filter-area" style="display:none">
      <div class="filter-row">
        <span class="filter-label">Área</span>
        <div class="chips" id="c-area">
          <button class="chip" data-val="" data-group="area" onclick="toggleChip(this)">Todas</button>
          <button class="chip" data-val="Metrix" data-group="area" onclick="toggleChip(this)">Metrix</button>
          <button class="chip" data-val="Forma" data-group="area" onclick="toggleChip(this)">Forma</button>
          <button class="chip" data-val="Moov" data-group="area" onclick="toggleChip(this)">Moov</button>
          <button class="chip" data-val="Vou" data-group="area" onclick="toggleChip(this)">Vou</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Tipo</span>
        <div class="chips" id="c-tipo">
          <button class="chip" data-val="" data-group="tipo" onclick="toggleChip(this)">Todos</button>
          <button class="chip" data-val="B2B" data-group="tipo" onclick="toggleChip(this)">B2B</button>
          <button class="chip" data-val="B2C" data-group="tipo" onclick="toggleChip(this)">B2C</button>
          <button class="chip" data-val="__empty__" data-group="tipo" onclick="toggleChip(this)">Sin datos</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Privado</span>
        <div class="chips" id="c-priv">
          <button class="chip" data-val="" data-group="priv" onclick="toggleChip(this)">Todos</button>
          <button class="chip" data-val="no" data-group="priv" onclick="toggleChip(this)">Solo públicos</button>
          <button class="chip" data-val="si" data-group="priv" onclick="toggleChip(this)">Solo privados</button>
          <button class="chip" data-val="__empty__" data-group="priv" onclick="toggleChip(this)">Sin respuesta</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Industria</span>
        <div class="chips" id="c-ind"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Servicio</span>
        <div class="chips" id="c-svc"></div>
      </div>
    </div>
    <div class="divider"></div>
    <div id="cases-wrap"><div class="loading">Cargando casos…</div></div>
  </div>
</div>

<script>
const PASSWORD='mmg2024';
function checkPwd(){
  const v=document.getElementById('pwd-input').value;
  if(v===PASSWORD){
    sessionStorage.setItem('mmg_auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('board').style.display='block';
    loadData();
  } else {
    document.getElementById('login-err').textContent='Contraseña incorrecta.';
    document.getElementById('pwd-input').value='';
  }
}
if(sessionStorage.getItem('mmg_auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('board').style.display='block';
}
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSnYUb4xmdEc3-mhSEwQ6eVPy5fVAvNfka6LkncVyrsokFffhzw5lJQeB6Q-DTjTLJzh1Fjrj0ZdzUu/pub?output=csv';
function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
  const headers=parseLine(lines[0]);
  console.log('[MMG] Headers:',headers);
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const vals=parseLine(lines[i]);
    const obj={};
    headers.forEach((h,j)=>{if(h.trim()) obj[h.trim()]=(vals[j]||'').trim();});
    rows.push(obj);
  }
  return rows;
}
function parseLine(line){
  const result=[];let i=0;
  while(true){
    if(i===line.length){result.push('');break;}
    if(i>line.length) break;
    if(line[i]==='"'){
      let val='',j=i+1;
      while(j<line.length){
        if(line[j]==='"'&&line[j+1]==='"'){val+='"';j+=2;}
        else if(line[j]==='"'){j++;break;}
        else val+=line[j++];
      }
      result.push(val);i=j;
      if(i<line.length&&line[i]===',') i++;
    } else {
      const end=line.indexOf(',',i);
      if(end===-1){result.push(line.slice(i));break;}
      result.push(line.slice(i,end));i=end+1;
    }
  }
  return result;
}
let DATA=[];
const SEL={area:new Set(),tipo:new Set(),priv:new Set(),ind:new Set(),svc:new Set()};
let openIdx=null;
const AREA_COLORS={Metrix:'#307FE2',Forma:'#FE5000',Moov:'#E0004D',Vou:'#DCFE6F'};
const AREA_TEXT={Metrix:'#fff',Forma:'#fff',Moov:'#fff',Vou:'#000'};
const SVC_KEYWORDS=['SEO','SEM','Analytics','CRO','Desarrollo Web','Audiovisual','CRM','Diseño','Influencer','RRSS','Planning','MELI','Social Listening'];
function norm(s){return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase();}
async function loadData(){
  try{
    const resp=await fetch(CSV_URL);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const text=await resp.text();
    const rows=parseCSV(text);
    DATA=rows.filter(r=>(r['Área']||r['Area']||'').trim()!=='').map(r=>{
      let ppt=(r['URL']||'').trim();
      if(ppt&&!ppt.startsWith('http')) ppt='';
      const blogKey=Object.keys(r).find(k=>k.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes('blog'));
      let blog=blogKey?(r[blogKey]||'').trim():'';
      if(['NA','N/A','na'].includes(blog)||(blog&&!blog.startsWith('http'))) blog='';
      const privRaw=norm((r['PRIVADO']||'').trim());
      let privado;
      if(privRaw==='SI'||privRaw==='TRUE') privado='si';
      else if(privRaw==='NO'||privRaw==='FALSE') privado='no';
      else privado='';
      const tipoKey=Object.keys(r).find(k=>{const kn=k.replace(/\//g,'').toLowerCase();return kn.includes('b2b')||kn.includes('b2c')||kn==='tipo';});
      const tipoRaw=tipoKey?norm((r[tipoKey]||'').trim()):'';
      let tipo;
      if(tipoRaw.includes('B2B')&&tipoRaw.includes('B2C')) tipo='B2B/B2C';
      else if(tipoRaw.includes('B2B')) tipo='B2B';
      else if(tipoRaw.includes('B2C')) tipo='B2C';
      else tipo='';
      const fechaKey=Object.keys(r).find(k=>k.toLowerCase().includes('fecha'));
      const fecha=fechaKey?(r[fechaKey]||'').trim():'';
      return{area:(r['Área']||r['Area']||'').trim(),servicio:(r['Servicio']||'').trim(),cliente:(r['Cliente']||'').trim(),industria:(r['Industria']||'').trim(),nombre:(r['Nombre del Caso']||'').trim(),privado,tipo,fecha,blog,ppt};
    });
    buildChips();
    document.getElementById('filter-area').style.display='flex';
    document.getElementById('cases-wrap').innerHTML='<div class="cases" id="cases"></div>';
    render();
  } catch(e){
    document.getElementById('cases-wrap').innerHTML='<div class="error-msg">Error al cargar los datos: '+e.message+'</div>';
    document.getElementById('count-lbl').textContent='Error';
  }
}
function buildChips(){
  const inds=[...new Set(DATA.map(d=>d.industria.split(',')[0].trim()).filter(Boolean))].sort();
  const indEl=document.getElementById('c-ind');
  indEl.innerHTML='<button class="chip" data-val="" data-group="ind" onclick="toggleChip(this)">Todas</button>';
  inds.forEach(i=>{const b=document.createElement('button');b.className='chip';b.dataset.val=i;b.dataset.group='ind';b.textContent=i;b.onclick=function(){toggleChip(this);};indEl.appendChild(b);});
  const svcEl=document.getElementById('c-svc');
  svcEl.innerHTML='<button class="chip" data-val="" data-group="svc" onclick="toggleChip(this)">Todos</button>';
  SVC_KEYWORDS.forEach(s=>{const b=document.createElement('button');b.className='chip';b.dataset.val=s;b.dataset.group='svc';b.textContent=s;b.onclick=function(){toggleChip(this);};svcEl.appendChild(b);});
}
const GID={area:'c-area',tipo:'c-tipo',priv:'c-priv',ind:'c-ind',svc:'c-svc'};
function toggleChip(el){
  const group=el.dataset.group,val=el.dataset.val,set=SEL[group];
  const gid=GID[group];
  if(val===''){
    set.clear();
    document.querySelectorAll('#'+gid+' .chip').forEach(c=>{c.style.cssText='';});
  } else {
    const allC=document.querySelector('#'+gid+' [data-val=""]');
    if(allC) allC.style.cssText='';
    if(set.has(val)){set.delete(val);el.style.cssText='';}
    else{
      set.add(val);
      if(group==='area'&&AREA_COLORS[val]){el.style.background=AREA_COLORS[val];el.style.color=AREA_TEXT[val];el.style.borderColor=AREA_COLORS[val];}
      else if(val==='__empty__'){el.style.background='#DCFE6F';el.style.color='#000';el.style.borderColor='#DCFE6F';}
      else{el.style.background='#F5F5F0';el.style.color='#0A0A0A';el.style.borderColor='#F5F5F0';}
    }
  }
  openIdx=null;render();
}
const LOCK=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FF6699" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
const CHEV=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
const PPT_I=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>`;
const BLOG_I=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
function openLink(url){window.open(url,'_blank');}
function render(){
  const q=(document.getElementById('q')||{value:''}).value.toLowerCase();
  const list=DATA.filter(d=>{
    if(SEL.area.size&&!SEL.area.has(d.area)) return false;
    if(SEL.tipo.size){const m=[...SEL.tipo].some(v=>v==='__empty__'?d.tipo==='':d.tipo.includes(v));if(!m) return false;}
    if(SEL.priv.size){const m=[...SEL.priv].some(v=>v==='__empty__'?d.privado==='':d.privado===v);if(!m) return false;}
    if(SEL.ind.size&&![...SEL.ind].some(v=>d.industria.toLowerCase().includes(v.toLowerCase()))) return false;
    if(SEL.svc.size&&![...SEL.svc].some(v=>d.servicio.toLowerCase().includes(v.toLowerCase()))) return false;
    if(q&&!d.nombre.toLowerCase().includes(q)&&!d.cliente.toLowerCase().includes(q)&&!d.industria.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('count-lbl').textContent=list.length+(list.length===1?' caso':' casos');
  const c=document.getElementById('cases');
  if(!c) return;
  if(!list.length){c.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  c.innerHTML=list.map((d,i)=>{
    const open=openIdx===i;
    const hB=d.blog&&d.blog.startsWith('http');
    const hP=d.ppt&&d.ppt.startsWith('http');
    const tipoTag=d.tipo?`<span class="tag t-tipo">${d.tipo}</span>`:'';
    const privBadge=d.privado==='si'?`&nbsp;${LOCK}`:'';
    return`<div class="case-card">
<div class="case-main" onclick="tog(${i})">
<div class="accent-bar a-${d.area||'none'}"></div>
<div class="case-body">
<div class="case-top"><span class="case-client">${d.cliente.toUpperCase()}</span>${privBadge}</div>
<div class="case-name">${d.nombre}</div>
<div class="tags">${d.area?`<span class="tag t-area-${d.area}">${d.area}</span>`:''}${d.servicio?`<span class="tag t-neutral">${d.servicio}</span>`:''}${tipoTag}</div>
</div>
<div class="case-right">
${hP?`<button class="btn-res" onclick="event.stopPropagation();openLink('${d.ppt}')">${PPT_I}&nbsp;One page</button>`:''}
${hB?`<button class="btn-res" onclick="event.stopPropagation();openLink('${d.blog}')">${BLOG_I}&nbsp;Blog</button>`:''}
<div class="chev-wrap${open?' open':''}">${CHEV}</div>
</div>
</div>
<div class="case-detail${open?' open':''}">
<div class="detail-grid">
<div><div class="dl">Cliente</div><div class="dv">${d.cliente}</div></div>
<div><div class="dl">Industria</div><div class="dv">${d.industria||'—'}</div></div>
<div><div class="dl">Servicio</div><div class="dv">${d.servicio||'—'}</div></div>
<div><div class="dl">Tipo</div><div class="dv">${d.tipo||'—'}</div></div>
<div><div class="dl">Publicación</div><div class="dv">${d.fecha||'—'}</div></div>
<div><div class="dl">Privado</div><div class="dv">${d.privado==='si'?'Sí':d.privado==='no'?'No':'—'}</div></div>
</div>
<div class="detail-links">
${hP?`<button class="lnk" onclick="openLink('${d.ppt}')">${PPT_I}&nbsp;Ver one page</button>`:''}
${hB?`<button class="lnk" onclick="openLink('${d.blog}')">${BLOG_I}&nbsp;Ver artículo</button>`:''}
${!hB&&!hP?'<span class="no-res-txt">Sin recursos disponibles aún.</span>':''}
</div>
</div>
</div>`;
  }).join('');
}
function tog(i){openIdx=openIdx===i?null:i;render();}
if(sessionStorage.getItem('mmg_auth')==='1') loadData();
</script>
</body>
