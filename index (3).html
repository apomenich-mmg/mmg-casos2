<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMG · Casos de Éxito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Funnel+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --lima:#DCFE6F;--pink:#EC92FF;--lav:#8FA4EF;
  --metrix:#307FE2;--forma:#FE5000;--moov:#E0004D;--vou:#DCFE6F;
  --bg:#FFFFFF;--bg2:#F7F7F5;--bg3:#F0F0EE;
  --border:#E5E5E2;--border2:#D0D0CC;
  --text:#0A0A0A;--text2:#666660;--text3:#AAAAAA;
}
html,body{height:100%}
body{font-family:'Funnel Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{text-align:center;width:320px}
.login-mark{font-size:10px;letter-spacing:0.22em;color:var(--text3);text-transform:uppercase;margin-bottom:40px;display:block;font-family:'Funnel Sans',sans-serif}
.login-headline{font-family:'Anton',sans-serif;font-size:52px;letter-spacing:0.04em;line-height:0.95;color:var(--text);margin-bottom:6px}
.login-sub{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text2);margin-bottom:36px}
.login-field input{width:100%;padding:12px 16px;font-size:14px;font-family:'Funnel Sans',sans-serif;background:var(--bg2);border:1px solid var(--border2);border-radius:9px;color:var(--text);outline:none;text-align:center;letter-spacing:0.08em;transition:border-color 0.15s;margin-bottom:10px}
.login-field input:focus{border-color:var(--text)}
.login-btn{width:100%;padding:12px;background:var(--text);color:#fff;font-family:'Funnel Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border:none;border-radius:9px;cursor:pointer;transition:opacity 0.15s}
.login-btn:hover{opacity:0.82}
.login-err{font-size:12px;color:var(--moov);margin-top:9px;min-height:16px}
.login-tagline{margin-top:44px;font-family:'Anton',sans-serif;font-size:10px;letter-spacing:0.26em;color:var(--border2);text-transform:uppercase}

/* LAYOUT */
#board{display:none;height:100vh;display:none;flex-direction:column}
#board.visible{display:flex}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100}
.topbar-inner{max-width:none;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{display:flex;align-items:center}
.brand-sep{width:1px;height:13px;background:var(--border2)}
.brand-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text2)}
.count-pill{background:var(--lima);color:#000;font-size:10px;font-weight:600;padding:3px 12px;border-radius:99px;letter-spacing:0.04em}

/* MAIN */
.app-body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:228px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:22px 16px 32px;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.hero-eyebrow{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.hero-title{font-family:'Anton',sans-serif;font-size:36px;letter-spacing:0.04em;line-height:0.93;color:var(--text)}
.hero-title em{color:var(--text);font-style:normal;border-bottom:4px solid var(--lima);padding-bottom:1px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;pointer-events:none;color:var(--text3)}
.search-wrap input{width:100%;padding:8px 10px 8px 30px;font-size:12px;font-family:'Funnel Sans',sans-serif;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border-color 0.15s}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap input:focus{border-color:var(--border2)}

/* FILTER SECTIONS */
.filter-section{display:flex;flex-direction:column;gap:6px}
.filter-label{font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text2)}
.chips-2col{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.chip{font-size:10px;font-weight:500;padding:5px 8px;border-radius:99px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.1s;line-height:1.2;font-family:'Funnel Sans',sans-serif;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--text);color:var(--text)}

/* COLLAPSIBLE */
.collapsible{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.coll-header{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--bg2);cursor:pointer;user-select:none;transition:background 0.1s}
.coll-header:hover{background:var(--bg3)}
.coll-header-label{font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text2)}
.coll-chev{font-size:10px;color:var(--text3);transition:transform 0.18s;line-height:1}
.coll-chev.open{transform:rotate(180deg)}
.coll-body{display:none;padding:8px;border-top:1px solid var(--border);background:var(--bg)}
.coll-body.open{display:block}
.coll-chips{display:grid;grid-template-columns:1fr 1fr;gap:4px}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:22px 24px 40px}
.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.content-meta{font-size:11px;color:var(--text2)}
.content-meta b{color:var(--text);font-weight:600}

/* GRID */
.cases-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{padding:4rem;text-align:center;font-size:13px;color:var(--text2);grid-column:1/-1}
.loading{text-align:center;padding:4rem;font-size:13px;color:var(--text2)}
.error-msg{background:#FFF0F0;border:1px solid #FFB0B0;border-radius:9px;padding:12px 16px;font-size:12px;color:#900;grid-column:1/-1}

/* CARD */
.case-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg);transition:border-color 0.12s,box-shadow 0.12s;display:flex;flex-direction:column}
.case-card:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card-accent{height:3px;flex-shrink:0}
.a-Metrix{background:var(--metrix)}.a-Forma{background:var(--forma)}.a-Moov{background:var(--moov)}.a-Vou{background:var(--vou)}.a-none{background:var(--border)}
.card-body{padding:12px 14px 10px;flex:1;cursor:pointer}
.card-client-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:3px}
.card-client{font-family:'Anton',sans-serif;font-size:17px;letter-spacing:0.07em;text-transform:uppercase;color:var(--text);line-height:1;flex:1;min-width:0}
.card-lock{flex-shrink:0;margin-top:2px}
.card-name{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:500;padding:2px 7px;border-radius:99px;white-space:nowrap;letter-spacing:0.03em}
.t-Metrix{background:#DCEEFF;color:#0C447C}
.t-Forma{background:#FDECD8;color:#8A3A04}
.t-Moov{background:#FFD6E3;color:#7A0025}
.t-Vou{background:#EEFAD0;color:#3D6500}
.t-neutral{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.t-tipo{background:#EEEDFE;color:#3C3489}
.card-footer{padding:8px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;background:var(--bg)}
.res-link{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);cursor:pointer;padding:3px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);transition:all 0.12s;font-family:'Funnel Sans',sans-serif;font-weight:500;letter-spacing:0.02em}
.res-link:hover{background:var(--lima);border-color:var(--lima);color:#000}
.res-link svg{width:10px;height:10px;flex-shrink:0}
.res-divider{width:1px;height:10px;background:var(--border)}
.card-expand-btn{margin-left:auto;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:none;background:none;cursor:pointer;color:var(--text3);padding:0;flex-shrink:0}
.card-expand-btn svg{transition:transform 0.18s}
.card-expand-btn.open svg{transform:rotate(180deg)}

/* DETAIL */
.card-detail{display:none;padding:10px 14px 14px;border-top:1px solid var(--border);background:var(--bg2)}
.card-detail.open{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px;margin-bottom:12px}
.dl{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.dv{font-size:12px;color:var(--text)}
.detail-links{display:flex;gap:7px;flex-wrap:wrap}
.dlnk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:6px 13px;border-radius:7px;border:1px solid var(--border2);color:var(--text);background:var(--bg);cursor:pointer;transition:all 0.12s;font-family:'Funnel Sans',sans-serif}
.dlnk:hover{background:var(--lima);border-color:var(--lima);color:#000}
.no-res{font-size:11px;color:var(--text3)}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:12px;overflow:hidden;width:92vw;height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,0.22)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}
.modal-title{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:0.07em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-open-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:5px 12px;border-radius:7px;border:1px solid var(--border2);color:var(--text2);background:transparent;cursor:pointer;font-family:'Funnel Sans',sans-serif;white-space:nowrap;flex-shrink:0;transition:all 0.12s}
.modal-open-btn:hover{background:var(--bg2)}
.modal-close{width:30px;height:30px;border-radius:99px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.12s}
.modal-close:hover{background:var(--bg2)}
.modal-iframe{flex:1;width:100%;border:none;background:var(--bg2)}
.modal-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text2);pointer-events:none}
.modal-frame-wrap{flex:1;position:relative;overflow:hidden}
</style>
</head>

function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
  const headers=parseLine(lines[0]);
  console.log('[MMG] Headers:',headers);
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const vals=parseLine(lines[i]);
    const obj={};
    headers.forEach((h,j)=>{if(h.trim()) obj[h.trim()]=(vals[j]||'').trim();});
    rows.push(obj);
  }
  return rows;
}
function parseLine(line){
  const result=[];let i=0;
  while(true){
    if(i===line.length){result.push('');break;}
    if(i>line.length) break;
    if(line[i]==='"'){
      let val='',j=i+1;
      while(j<line.length){
        if(line[j]==='"'&&line[j+1]==='"'){val+='"';j+=2;}
        else if(line[j]==='"'){j++;break;}
        else val+=line[j++];
      }
      result.push(val);i=j;
      if(i<line.length&&line[i]===',') i++;
    } else {
      const end=line.indexOf(',',i);
      if(end===-1){result.push(line.slice(i));break;}
      result.push(line.slice(i,end));i=end+1;
    }
  }
  return result;
}

let DATA=[];
const SEL={area:new Set(),tipo:new Set(),priv:new Set(),ind:new Set(),svc:new Set()};
let openIdx=null;
const AREA_COLORS={Metrix:'#307FE2',Forma:'#FE5000',Moov:'#E0004D',Vou:'#DCFE6F'};
const AREA_TEXT={Metrix:'#fff',Forma:'#fff',Moov:'#fff',Vou:'#000'};
const SVC_KEYWORDS=['SEO','SEM','Analytics','CRO','Desarrollo Web','Audiovisual','CRM','Diseño','Influencer','RRSS','Planning','MELI','Social Listening'];
function norm(s){return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase();}

async function loadData(){
  try{
    const resp=await fetch(CSV_URL);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const text=await resp.text();
    const rows=parseCSV(text);
    DATA=rows.filter(r=>(r['Área']||r['Area']||'').trim()!=='').map(r=>{
      let ppt=(r['URL']||'').trim();
      if(ppt&&!ppt.startsWith('http')) ppt='';
      const blogKey=Object.keys(r).find(k=>k.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes('blog'));
      let blog=blogKey?(r[blogKey]||'').trim():'';
      if(['NA','N/A','na'].includes(blog)||(blog&&!blog.startsWith('http'))) blog='';
      const privRaw=norm((r['PRIVADO']||'').trim());
      let privado;
      if(privRaw==='SI'||privRaw==='TRUE') privado='si';
      else if(privRaw==='NO'||privRaw==='FALSE') privado='no';
      else privado='';
      const tipoKey=Object.keys(r).find(k=>{const kn=k.replace(/\//g,'').toLowerCase();return kn.includes('b2b')||kn.includes('b2c')||kn==='tipo';});
      const tipoRaw=tipoKey?norm((r[tipoKey]||'').trim()):'';
      let tipo;
      if(tipoRaw.includes('B2B')&&tipoRaw.includes('B2C')) tipo='B2B/B2C';
      else if(tipoRaw.includes('B2B')) tipo='B2B';
      else if(tipoRaw.includes('B2C')) tipo='B2C';
      else tipo='';
      const fechaKey=Object.keys(r).find(k=>k.toLowerCase().includes('fecha'));
      const fecha=fechaKey?(r[fechaKey]||'').trim():'';
      return{area:(r['Área']||r['Area']||'').trim(),servicio:(r['Servicio']||'').trim(),cliente:(r['Cliente']||'').trim(),industria:(r['Industria']||'').trim(),nombre:(r['Nombre del Caso']||'').trim(),privado,tipo,fecha,blog,ppt};
    });
    buildChips();
    document.getElementById('filter-area').style.display='flex';
    document.getElementById('cases-wrap').innerHTML='<div class="content-header"><p class="content-meta" id="content-meta"></p></div><div class="cases-grid" id="cases"></div>';
    render();
  } catch(e){
    document.getElementById('cases-wrap').innerHTML='<div class="error-msg">Error al cargar los datos: '+e.message+'</div>';
    document.getElementById('count-lbl').textContent='Error';
  }
}

function buildChips(){
  const inds=[...new Set(DATA.map(d=>d.industria.split(',')[0].trim()).filter(Boolean))].sort();

  allInd.className='chip';allInd.dataset.val='';allInd.dataset.group='ind';allInd.textContent='Todas';allInd.onclick=function(){toggleChip(this);};
  indEl.appendChild(allInd);
  inds.forEach(i=>{const b=document.createElement('button');b.className='chip';b.dataset.val=i;b.dataset.group='ind';b.textContent=i;b.onclick=function(){toggleChip(this);};indEl.appendChild(b);});

  const svcEl=document.getElementById('c-svc');
  svcEl.innerHTML='';
  const allSvc=document.createElement('button');
  allSvc.className='chip';allSvc.dataset.val='';allSvc.dataset.group='svc';allSvc.textContent='Todos';allSvc.onclick=function(){toggleChip(this);};
  svcEl.appendChild(allSvc);

}

const GID={area:'c-area',tipo:'c-tipo',priv:'c-priv',ind:'c-ind',svc:'c-svc'};

function toggleChip(el){
  const group=el.dataset.group,val=el.dataset.val,set=SEL[group];
  const gid=GID[group];
  if(val===''){
    set.clear();
    document.querySelectorAll('#'+gid+' .chip').forEach(c=>{c.style.cssText='';});
  } else {
    const allC=document.querySelector('#'+gid+' [data-val=""]');
    if(allC) allC.style.cssText='';
    if(set.has(val)){set.delete(val);el.style.cssText='';}
    else{
      set.add(val);
      if(group==='area'&&AREA_COLORS[val]){
        el.style.background=AREA_COLORS[val];el.style.color=AREA_TEXT[val];el.style.borderColor=AREA_COLORS[val];
      } else if(val==='__empty__'){
        el.style.background='#DCFE6F';el.style.color='#000';el.style.borderColor='#DCFE6F';
      } else {
        el.style.background='#0A0A0A';el.style.color='#fff';el.style.borderColor='#0A0A0A';
      }
    }
  }
  openIdx=null;render();
}

<div class="card-accent a-${d.area||'none'}"></div>

<div class="card-detail${open?' open':''}">

    ${hP?`<button class="dlnk" onclick="openModal('${d.ppt}','${d.cliente}')">${PPT_I}&nbsp;Ver one page</button>`:''}

let _modalOrigUrl = '';

function embedUrl(url) {
  if (!url) return '';
  // Google Slides: /presentation/d/ID/edit or /pub -> /embed
  if (url.includes('docs.google.com/presentation')) {
    // Already embed
    if (url.includes('/embed')) return url;
    // pub?
    if (url.includes('/pub')) return url.replace('/pub', '/embed');
    // edit or anything else -> strip query, add /embed
    const base = url.split('/edit')[0].split('/pub')[0].split('/present')[0];
    return base + '/embed?start=false&loop=false&delayms=0';
  }
  // Google Drive file (PDF etc): /file/d/ID/view -> /file/d/ID/preview
  if (url.includes('drive.google.com/file')) {
    return url.replace('/view', '/preview').replace('/edit', '/preview');
  }
  // Google Docs
  if (url.includes('docs.google.com/document')) {
    return url.replace('/edit', '/preview').replace('/pub', '/preview');
  }
  // Fallback: try as-is
  return url;
}

function openModal(url, title) {
  _modalOrigUrl = url;
  const embed = embedUrl(url);
  document.getElementById('modal-title').textContent = title || 'One page';
  document.getElementById('modal-loading').style.display = 'flex';
  document.getElementById('modal-iframe').src = embed;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-iframe').src = '';
  document.body.style.overflow = '';
}

function openModalExternal() {
  window.open(_modalOrigUrl, '_blank');
}

// Close on Escape
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModalDirect(); });

</div>
